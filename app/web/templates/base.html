<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}印前文件服务器{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body data-menu="closed" data-page="{% block page %}index{% endblock %}">
    <!-- 侧栏 -->
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="3" width="18" height="18" rx="5" fill="currentColor" opacity="0.12"/>
                    <circle cx="12" cy="12" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/>
                    <circle cx="12" cy="12" r="1.3" fill="currentColor"/>
                </svg>
            </div>
            <div class="brand-text">
                <span class="brand-name">印前文件服务器</span>
                <span class="brand-sub">Prepress Studio</span>
            </div>
        </div>

        <nav class="nav">
            <span class="nav-label">作业</span>
            <a class="nav-item" href="/" data-target="index">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2.5h5.5v5.5H2zM8.5 2.5H14v5.5H8.5zM2 8.5h5.5V14H2zM8.5 8.5H14V14H8.5z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                印前生成
            </a>
            <a class="nav-item is-disabled" href="#" title="未启用">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                排版拼版
                <span class="tag">未启用</span>
            </a>
            <a class="nav-item" href="/library" data-target="library">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 3.5h12v9H2zM2 6.5h12M6 6.5v6" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
                文件库
            </a>

            <span class="nav-label">系统</span>
            <!-- 配置：可折叠子菜单 -->
            <div class="nav-group" id="cfg-nav-group">
                <button class="nav-item nav-parent" type="button" data-toggle>
                    <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 1.6v2M8 12.4v2M1.6 8h2M12.4 8h2M3.5 3.5l1.4 1.4M11.1 11.1l1.4 1.4M12.5 3.5l-1.4 1.4M4.9 11.1l-1.4 1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                    配置
                    <svg class="nav-caret" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 4l3 3 3-3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div class="nav-sub">
                    <a class="nav-sub-item" href="/config/prepress" data-target="config-prepress">印前配置</a>
                    <a class="nav-sub-item" href="/config/impose" data-target="config-impose">排版配置</a>
                    <a class="nav-sub-item" href="/config/storage" data-target="config-storage">存储配置</a>
                </div>
            </div>
            <a class="nav-item is-disabled" href="#" title="未启用">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 2h7l3 3v9H3z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M5 7h6M5 9.5h6M5 12h4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
                任务记录
                <span class="tag">未启用</span>
            </a>
        </nav>

        <div class="sidebar-foot">
            <div class="readout">
                <span class="readout-dot"></span>
                引擎就绪
            </div>
            <span class="readout-ver">v0.1 · 实现阶段</span>
        </div>
    </aside>

    <!-- 主区 -->
    <div class="main">
        <header class="topbar">
            <button class="menu-toggle" id="menu-toggle" aria-label="菜单">
                <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12M2 8h12M2 12h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            </button>
            <div class="topbar-title">
                {% block breadcrumb %}<span class="crumb">作业</span><span class="crumb-sep">/</span><span class="crumb-current">印前生成</span>{% endblock %}
            </div>
            <div class="topbar-readout">
                {% block readout %}<span class="ro-item">任务 <b id="task-count">0</b></span>{% endblock %}
            </div>
        </header>

        <main class="content">
            {% block content %}{% endblock %}
        </main>
    </div>

    <div class="scrim" id="scrim"></div>
    <script src="/static/nav.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
