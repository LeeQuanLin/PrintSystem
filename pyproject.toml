[project]
name = "prepress-server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "psd-tools>=1.18.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.32",
    "python-ulid>=3.0",
    "pyvips>=3.1.1",
    "uvicorn>=0.52.4",
    "websockets>=17.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

